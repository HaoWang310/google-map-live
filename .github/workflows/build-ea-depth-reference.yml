name: Build EA 2070s 0.1 percent AEP flood depth reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_ea_surface_depth.py
      - .github/workflows/build-ea-depth-reference.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS packages
        run: |
          python -m pip install numpy pillow rasterio
      - name: Decode source-verified Environment Agency depth classes
        run: python scripts/build_ea_surface_depth.py .cache/ea_depth_0p1
      - name: Publish official depth reference pixels and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flood_risk/ea_depth_cc_0p1_*.webp assets/flood_risk/ea_depth_cc_0p1_metadata.json assets/flood_risk/ea_depth_0p1_2070upper_official.sld
          if ! git diff --cached --quiet; then
            git commit -m "data: publish EA official future 0.1 percent AEP depth-reference grid"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
