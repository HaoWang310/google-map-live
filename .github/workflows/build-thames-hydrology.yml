name: Build full Thames hydrology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_thames_hydrology.py"
      - ".github/workflows/build-thames-hydrology.yml"

permissions:
  contents: write

concurrency:
  group: full-thames-hydrology
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hydrology dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow requests rasterio pyflwdir

      - name: Build complete Thames upstream accumulation
        run: python scripts/build_thames_hydrology.py

      - name: Show validation metadata
        run: |
          python - <<'PY'
          import json
          p=json.load(open('assets/drainage_area/metadata.json'))
          print(json.dumps(p['validation'], indent=2))
          PY

      - name: Commit generated shared hydrology field
        run: |
          if git diff --quiet -- assets/drainage_area/area_log16.webp assets/drainage_area/dem50_log16.webp assets/drainage_area/metadata.json; then
            echo "Hydrology output unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/drainage_area/area_log16.webp assets/drainage_area/dem50_log16.webp assets/drainage_area/metadata.json
          git commit -m "Build complete Thames 50 m hydrology field [skip hydrology]"
          git push
