<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>London Map Live</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css">

  <style>
    html,body,#googleMap,#osmMap{height:100%;margin:0}
    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",
      "PingFang SC","Microsoft YaHei",sans-serif;
      overflow:hidden;background:#dbe5ef
    }
    #googleMap,#osmMap{position:absolute;inset:0}
    #osmMap{display:none}
    .panel{
      position:absolute;z-index:20;top:14px;left:14px;
      width:min(370px,calc(100vw - 28px));padding:14px;border-radius:14px;
      background:rgba(24,32,47,.95);color:#fff;
      box-shadow:0 16px 45px rgba(0,0,0,.28);backdrop-filter:blur(12px)
    }
    .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .title{font-size:18px;font-weight:750}
    .sub{margin-top:3px;color:#aeb8c8;font-size:11px;line-height:1.5}
    select,button{
      font:inherit;border-radius:9px;border:1px solid rgba(255,255,255,.12)
    }
    select{
      width:100%;min-height:40px;padding:8px 10px;
      background:#2b3547;color:#fff;outline:none
    }
    button{
      min-height:39px;padding:8px 12px;color:#fff;background:#2f76ff;
      font-weight:650;cursor:pointer
    }
    button.secondary{background:#3a4659}
    .row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}
    .divider{height:1px;background:rgba(255,255,255,.12);margin:13px 0}
    .section{font-size:12px;color:#d7deea;margin-bottom:7px}
    .status{font-size:11px;line-height:1.5;color:#bfd3ff;margin-top:10px;white-space:pre-line}
    .status.error{color:#ffb8b8}
    .note{font-size:10px;line-height:1.5;color:#99a6b9;margin-top:8px}
    .coords{
      position:absolute;z-index:10;right:12px;bottom:12px;padding:7px 9px;
      border-radius:8px;background:rgba(24,32,47,.9);color:#fff;font-size:11px
    }
    #collapse{flex:0 0 38px;min-width:38px;padding:0;background:#3a4659}
    .collapsed .content{display:none}
    .providerBadge{
      display:inline-flex;align-items:center;gap:6px;margin-top:7px;
      padding:4px 7px;border-radius:999px;background:#334155;color:#dbeafe;font-size:10px
    }
    .layerRow{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:9px 10px;border-radius:9px;background:#2b3547;
      border:1px solid rgba(255,255,255,.12);font-size:12px
    }
    .layerRow input{width:18px;height:18px}
    .rangeRow{
      display:grid;grid-template-columns:auto 1fr 38px;align-items:center;gap:8px;
      margin-top:8px;font-size:11px;color:#cbd5e1
    }
    .rangeRow input[type=range]{width:100%}
    .terrainMeta{font-size:9px;line-height:1.45;color:#8fa0b5;margin-top:7px}
    @media(max-width:600px){
      .panel{top:8px;left:8px;width:calc(100vw - 16px);padding:12px}
    }
  </style>
</head>
<body>
  <div id="googleMap"></div>
  <div id="osmMap"></div>

  <div class="panel" id="panel">
    <div class="head">
      <div>
        <div class="title">London Map Live</div>
        <div class="sub">Google Maps + OpenStreetMap / OpenFreeMap · v3.8.1</div>
        <div class="providerBadge" id="providerBadge">Google Maps</div>
      </div>
      <button id="collapse">−</button>
    </div>

    <div class="content">
      <div class="divider"></div>

      <div class="section">地图来源</div>
      <select id="provider">
        <option value="google">Google Maps</option>
        <option value="osm">OpenStreetMap / OpenFreeMap</option>
      </select>

      <div class="divider"></div>

      <div class="section">Google 地图类型</div>
      <select id="mapType">
        <option value="roadmap">道路图 Roadmap</option>
        <option value="satellite">卫星图 Satellite</option>
        <option value="hybrid">混合图 Hybrid</option>
        <option value="terrain">地形图 Terrain</option>
      </select>

      <div class="divider"></div>
      <div class="section">真实地形图层</div>
      <label class="layerRow">
        <span>EA LiDAR DTM 1 m · HD</span>
        <input id="terrainToggle" type="checkbox" checked>
      </label>
      <div class="rangeRow">
        <span>透明度</span>
        <input id="terrainOpacity" type="range" min="0" max="1" step="0.05" value="0.72">
        <span id="terrainOpacityValue">72%</span>
      </div>
      <div class="row">
        <button id="terrainFit" class="secondary">定位到 70 km 范围</button>
      </div>
      <div class="terrainMeta">
        Environment Agency LiDAR Composite DTM 1 m · Dynamic WMS · EPSG:3857 · Open Government Licence
      </div>

      <div class="row">
        <button id="londonBtn" class="secondary">伦敦</button>
        <button id="locateBtn" class="secondary">定位我</button>
        <button id="resetBtn" class="secondary">重置</button>
      </div>

      <div id="status" class="status">正在初始化地图…</div>
      <div class="note" id="note">
        稳定模式：Google 地形不再用小瓦片拼接；停止移动后一次加载当前窗口完整 WMS 图像，避免缺块。</div>
    </div>
  </div>

  <div id="coords" class="coords">Lat — / Lng — / Zoom —</div>

<script type="module">
  import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs';

  const API_KEY='AIzaSyANIQCOwWyl_-uJdc8JxLn7D5Y1AC55cY8';
  const CENTER={lat:51.5074,lng:-0.1278};
  const ZOOM=10;

  // Official Environment Agency LiDAR Composite DTM 1 m.
  // Dynamic WMS: requests a fresh raster tile for every zoom level.
  const EA_WMS_BASE='https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wms';
  const EA_WMS_LAYER='Lidar_Composite_DTM_1m';

  // Original 70 km study extent centred on Charing Cross E530037 N180373.
  const TERRAIN_BOUNDS={
    west:-1.1478120391692022,
    south:50.858309108610484,
    east:0.9210948646196429,
    north:52.14838885409756
  };

  function tileBBox3857(x,y,z){
    const origin=20037508.342789244;
    const world=origin*2;
    const size=world/Math.pow(2,z);
    const minx=-origin+x*size;
    const maxx=minx+size;
    const maxy= origin-y*size;
    const miny=maxy-size;
    return [minx,miny,maxx,maxy].join(',');
  }

  function tileBoundsLngLat(x,y,z){
    const n=Math.pow(2,z);
    const west=x/n*360-180;
    const east=(x+1)/n*360-180;
    const north=Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;
    const south=Math.atan(Math.sinh(Math.PI*(1-2*(y+1)/n)))*180/Math.PI;
    return {west,east,north,south};
  }

  function intersectsTerrainBounds(b){
    return !(
      b.east<TERRAIN_BOUNDS.west ||
      b.west>TERRAIN_BOUNDS.east ||
      b.north<TERRAIN_BOUNDS.south ||
      b.south>TERRAIN_BOUNDS.north
    );
  }

  const EMPTY_TILE=
    'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

  function eaWmsUrlForGoogle(coord,zoom){
    // Do not request 1 m LiDAR when zoomed far out.
    if(zoom<8)return EMPTY_TILE;

    // Only request tiles intersecting the original 70 km London study area.
    const ll=tileBoundsLngLat(coord.x,coord.y,zoom);
    if(!intersectsTerrainBounds(ll))return EMPTY_TILE;

    const bbox=tileBBox3857(coord.x,coord.y,zoom);
    const q=new URLSearchParams({
      SERVICE:'WMS',
      VERSION:'1.3.0',
      REQUEST:'GetMap',
      LAYERS:EA_WMS_LAYER,
      STYLES:'',
      FORMAT:'image/png',
      TRANSPARENT:'TRUE',
      CRS:'EPSG:3857',
      WIDTH:'256',
      HEIGHT:'256',
      BBOX:bbox
    });
    return EA_WMS_BASE+'?'+q.toString();
  }

  const EA_WMS_MAPLIBRE =
    EA_WMS_BASE+
    '?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap'+
    '&LAYERS='+encodeURIComponent(EA_WMS_LAYER)+
    '&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE'+
    '&CRS=EPSG:3857&WIDTH=256&HEIGHT=256'+
    '&BBOX={bbox-epsg-3857}';

  let googleMap=null;
  let osmMap=null;
  let googleMarker=null;
  let osmMarker=null;
  let googleLoading=false;
  let currentProvider='google';
  let googleTerrainOverlay=null;
  let googleTerrainRefreshTimer=null;
  let googleTerrainRequestId=0;
  let terrainEnabled=true;
  let terrainOpacity=0.72;
  let sharedView={lat:CENTER.lat,lng:CENTER.lng,zoom:ZOOM,source:currentProvider};

  const $=id=>document.getElementById(id);
  const say=(m,e=false)=>{
    $('status').textContent=m;
    $('status').className='status'+(e?' error':'');
  };

  function syncBadge(){
    $('providerBadge').textContent =
      currentProvider==='google' ? 'Google Maps' : 'OpenStreetMap · no API key';
    $('mapType').disabled = currentProvider!=='google';
    $('note').textContent = currentProvider==='google'
      ? 'Google Maps 使用内置 Demo Key。卫星图 / 混合图 / 地形图从这里切换。'
      : 'OpenStreetMap 模式使用 OpenFreeMap 矢量瓦片 + MapLibre GL JS，不需要 API Key。';
  }

  window.gm_authFailure=()=>{
    say('Google 拒绝了当前 Demo Key。你仍可以切换到 OpenStreetMap 使用地图。',true);
  };

  function loadGoogleScript(){
    return new Promise((resolve,reject)=>{
      if(window.google&&window.google.maps){resolve();return;}
      if(googleLoading){
        const t=setInterval(()=>{
          if(window.google&&window.google.maps){clearInterval(t);resolve();}
        },100);
        setTimeout(()=>{clearInterval(t);reject(new Error('Google Maps 加载超时。'));},20000);
        return;
      }
      googleLoading=true;
      window.__initGoogleMap=()=>{googleLoading=false;resolve();};
      const s=document.createElement('script');
      s.async=true;s.defer=true;
      s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(API_KEY)+
        '&loading=async&libraries=maps&v=weekly&language=zh-CN&region=GB&callback=__initGoogleMap';
      s.onerror=()=>{googleLoading=false;reject(new Error('Google Maps 脚本下载失败。'))};
      document.head.appendChild(s);
    });
  }

  function mercatorX(lng){
    return lng * 20037508.342789244 / 180;
  }

  function mercatorY(lat){
    const clamped=Math.max(-85.05112878,Math.min(85.05112878,lat));
    const rad=clamped*Math.PI/180;
    return 6378137*Math.log(Math.tan(Math.PI/4+rad/2));
  }

  function intersectViewBounds(bounds){
    if(!bounds)return null;
    const ne=bounds.getNorthEast();
    const sw=bounds.getSouthWest();
    const clipped={
      west:Math.max(sw.lng(),TERRAIN_BOUNDS.west),
      south:Math.max(sw.lat(),TERRAIN_BOUNDS.south),
      east:Math.min(ne.lng(),TERRAIN_BOUNDS.east),
      north:Math.min(ne.lat(),TERRAIN_BOUNDS.north)
    };
    if(clipped.west>=clipped.east || clipped.south>=clipped.north)return null;
    return clipped;
  }

  function eaViewportWmsUrl(bounds,width,height){
    const bbox=[
      mercatorX(bounds.west),
      mercatorY(bounds.south),
      mercatorX(bounds.east),
      mercatorY(bounds.north)
    ].join(',');

    const q=new URLSearchParams({
      SERVICE:'WMS',
      VERSION:'1.3.0',
      REQUEST:'GetMap',
      LAYERS:EA_WMS_LAYER,
      STYLES:'',
      FORMAT:'image/png',
      TRANSPARENT:'TRUE',
      CRS:'EPSG:3857',
      WIDTH:String(width),
      HEIGHT:String(height),
      BBOX:bbox
    });
    return EA_WMS_BASE+'?'+q.toString();
  }

  function scheduleGoogleTerrainRefresh(delay=180){
    if(!googleMap || !terrainEnabled)return;
    clearTimeout(googleTerrainRefreshTimer);
    googleTerrainRefreshTimer=setTimeout(refreshGoogleTerrainViewport,delay);
  }

  async function refreshGoogleTerrainViewport(){
    if(!googleMap || !terrainEnabled)return;

    const clipped=intersectViewBounds(googleMap.getBounds());
    if(!clipped){
      if(googleTerrainOverlay){
        googleTerrainOverlay.setMap(null);
        googleTerrainOverlay=null;
      }
      return;
    }

    const div=googleMap.getDiv();
    const dpr=Math.min(window.devicePixelRatio||1,1.5);
    const width=Math.max(512,Math.min(1600,Math.round(div.clientWidth*dpr)));
    const height=Math.max(512,Math.min(1200,Math.round(div.clientHeight*dpr)));
    const url=eaViewportWmsUrl(clipped,width,height);

    const requestId=++googleTerrainRequestId;
    say('正在加载当前窗口完整地形…');

    const img=new Image();
    img.onload=()=>{
      if(requestId!==googleTerrainRequestId || !terrainEnabled)return;

      const next=new google.maps.GroundOverlay(
        url,
        clipped,
        {opacity:terrainOpacity,clickable:false}
      );
      next.setMap(googleMap);

      const previous=googleTerrainOverlay;
      googleTerrainOverlay=next;
      if(previous)previous.setMap(null);

      say('EA 1 m LiDAR：当前窗口已完整加载。');
    };
    img.onerror=()=>{
      if(requestId!==googleTerrainRequestId)return;
      say('地形图本次加载失败，保留上一张完整图层。',true);
    };
    img.src=url;
  }

  function detachGoogleTerrain(){
    clearTimeout(googleTerrainRefreshTimer);
    googleTerrainRequestId++;
    if(googleTerrainOverlay){
      googleTerrainOverlay.setMap(null);
      googleTerrainOverlay=null;
    }
  }

  function updateGoogleTerrain(){
    if(!googleMap || !window.google?.maps)return;

    if(!terrainEnabled){
      detachGoogleTerrain();
      return;
    }

    if(googleTerrainOverlay){
      googleTerrainOverlay.setOpacity(terrainOpacity);
    }
    scheduleGoogleTerrainRefresh(60);
  }

  function updateOsmTerrain(){
    if(!osmMap || !osmMap.loaded())return;

    if(!osmMap.getSource('ea-lidar-dtm-1m')){
      osmMap.addSource('ea-lidar-dtm-1m',{
        type:'raster',
        tiles:[EA_WMS_MAPLIBRE],
        tileSize:256,
        minzoom:8,
        maxzoom:19,
        bounds:[
          TERRAIN_BOUNDS.west,
          TERRAIN_BOUNDS.south,
          TERRAIN_BOUNDS.east,
          TERRAIN_BOUNDS.north
        ],
        attribution:'© Environment Agency copyright and/or database right'
      });
    }

    if(!osmMap.getLayer('ea-lidar-dtm-1m-layer')){
      const layers=osmMap.getStyle()?.layers||[];
      const firstLabels=layers.find(layer=>layer.type==='symbol')?.id;
      osmMap.addLayer({
        id:'ea-lidar-dtm-1m-layer',
        type:'raster',
        source:'ea-lidar-dtm-1m',
        layout:{visibility:terrainEnabled?'visible':'none'},
        paint:{
          'raster-opacity':terrainOpacity,
          'raster-fade-duration':0,
          'raster-resampling':'linear'
        }
      },firstLabels);
    }else{
      osmMap.setLayoutProperty(
        'ea-lidar-dtm-1m-layer',
        'visibility',
        terrainEnabled?'visible':'none'
      );
      osmMap.setPaintProperty(
        'ea-lidar-dtm-1m-layer',
        'raster-opacity',
        terrainOpacity
      );
    }
  }

  function updateTerrainLayers(){
    // Only update the active map. The hidden provider is initialized lazily.
    if(currentProvider==='google'){
      updateGoogleTerrain();
    }else{
      updateOsmTerrain();
    }
  }

  async function initGoogle(){
    if(googleMap)return;
    say('正在加载 Google Maps…');
    try{
      await loadGoogleScript();
      const {Map}=await google.maps.importLibrary('maps');
      googleMap=new Map($('googleMap'),{
        center:CENTER,zoom:ZOOM,mapId:'DEMO_MAP_ID',
        mapTypeId:$('mapType').value,
        gestureHandling:'greedy',
        mapTypeControl:false,
        isFractionalZoomEnabled:true,
        streetViewControl:true,
        fullscreenControl:true,
        zoomControl:true,
        scaleControl:true
      });
      googleMap.addListener('mousemove',e=>{
        if(currentProvider!=='google')return;
        $('coords').textContent='Lat '+e.latLng.lat().toFixed(5)+
          ' / Lng '+e.latLng.lng().toFixed(5)+' / Zoom '+googleMap.getZoom();
      });
      googleMap.addListener('zoom_changed',()=>{
        if(currentProvider!=='google')return;
        const center=googleMap.getCenter(); if(!center)return;
        $('coords').textContent='Lat '+center.lat().toFixed(5)+
          ' / Lng '+center.lng().toFixed(5)+' / Zoom '+googleMap.getZoom();
      });

      googleMap.addListener('idle',()=>{
        if(currentProvider==='google' && terrainEnabled){
          scheduleGoogleTerrainRefresh(120);
        }
      });

      googleMap.addListener('dragstart',()=>{
        clearTimeout(googleTerrainRefreshTimer);
      });

      updateGoogleTerrain();
      if(currentProvider==='google')say('Google Maps 已加载；完整窗口地形模式已启用。');
    }catch(err){
      console.error(err);
      say('Google Maps 加载失败；可以切换到 OpenStreetMap。',true);
    }
  }

  function initOSM(){
    if(osmMap)return;
    say('正在加载 OpenStreetMap…');
    osmMap=new maplibregl.Map({
      container:'osmMap',
      style:'https://tiles.openfreemap.org/styles/liberty',
      center:[CENTER.lng,CENTER.lat],
      zoom:ZOOM,
      pitch:0,
      bearing:0,
      attributionControl:true
    });

    osmMap.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
    osmMap.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');

    osmMap.on('load',()=>{
      if(currentProvider==='osm'){
        updateOsmTerrain();
        say('OpenStreetMap 已连接；EA 1 m LiDAR 已按需加载。');
      }
    });
    osmMap.on('mousemove',e=>{
      if(currentProvider!=='osm')return;
      $('coords').textContent='Lat '+e.lngLat.lat.toFixed(5)+
        ' / Lng '+e.lngLat.lng.toFixed(5)+' / Zoom '+osmMap.getZoom().toFixed(1);
    });
    osmMap.on('error',e=>{
      console.error(e.error||e);
    });
  }

  function captureCurrentView(){
    if(currentProvider==='google' && googleMap){
      const center=googleMap.getCenter();
      const zoom=googleMap.getZoom();
      if(center && Number.isFinite(zoom)){
        sharedView={
          lat:center.lat(),
          lng:center.lng(),
          zoom,
          source:'google'
        };
      }
    }else if(currentProvider==='osm' && osmMap){
      const center=osmMap.getCenter();
      const zoom=osmMap.getZoom();
      if(center && Number.isFinite(zoom)){
        sharedView={
          lat:center.lat,
          lng:center.lng,
          zoom,
          source:'osm'
        };
      }
    }
  }

  function targetZoomFor(provider){
    // Google uses a 256 px world at zoom 0; MapLibre uses 512 px.
    // Therefore the same ground resolution is Google zoom = MapLibre zoom + 1.
    if(sharedView.source==='google' && provider==='osm'){
      return sharedView.zoom - 1;
    }
    if(sharedView.source==='osm' && provider==='google'){
      return sharedView.zoom + 1;
    }
    return sharedView.zoom;
  }

  function applySharedView(provider){
    const center={lat:sharedView.lat,lng:sharedView.lng};
    const targetZoom=targetZoomFor(provider);

    if(provider==='google' && googleMap){
      googleMap.setCenter(center);
      googleMap.setZoom(targetZoom);

      // Re-assert exact center after Google finishes its camera update.
      google.maps.event.addListenerOnce(googleMap,'idle',()=>{
        const now=googleMap.getCenter();
        if(!now) return;
        const dLat=Math.abs(now.lat()-center.lat);
        const dLng=Math.abs(now.lng()-center.lng);
        if(dLat>1e-9 || dLng>1e-9){
          googleMap.setCenter(center);
        }
      });
    }else if(provider==='osm' && osmMap){
      osmMap.jumpTo({
        center:[center.lng,center.lat],
        zoom:targetZoom,
        pitch:0,
        bearing:0
      });

      // Re-assert exact center after resize/render.
      requestAnimationFrame(()=>{
        if(!osmMap) return;
        osmMap.setCenter([center.lng,center.lat]);
        osmMap.setZoom(targetZoom);
      });
    }
  }

  async function switchProvider(provider){
    if(provider===currentProvider){
      syncBadge();
      return;
    }

    captureCurrentView();
    currentProvider=provider;
    if(provider==='google'){
      $('googleMap').style.display='block';
      $('osmMap').style.display='none';
      syncBadge();
      await initGoogle();
      if(googleMap){
        applySharedView('google');
        setTimeout(()=>{
          google.maps.event.trigger(googleMap,'resize');
          applySharedView('google');
        },50);
        updateGoogleTerrain();
        say('Google Maps 模式；地形图层按需加载。');
      }
    }else{
      $('googleMap').style.display='none';
      $('osmMap').style.display='block';
      syncBadge();
      initOSM();
      if(osmMap){
        applySharedView('osm');
        setTimeout(()=>{
          osmMap.resize();
          applySharedView('osm');
        },100);
      }
      if(osmMap&&osmMap.loaded()){
        updateOsmTerrain();
        say('OpenStreetMap 模式；地形图层按需加载。');
      }
    }
  }

  $('provider').addEventListener('change',e=>{ switchProvider(e.target.value); });

  $('mapType').addEventListener('change',e=>{
    if(googleMap)googleMap.setMapTypeId(e.target.value);
  });

  $('terrainToggle').addEventListener('change',e=>{
    terrainEnabled=e.target.checked;
    updateTerrainLayers();
  });

  $('terrainOpacity').addEventListener('input',e=>{
    terrainOpacity=Number(e.target.value);
    $('terrainOpacityValue').textContent=Math.round(terrainOpacity*100)+'%';
    if(currentProvider==='google' && googleTerrainOverlay){
      googleTerrainOverlay.setOpacity(terrainOpacity);
    }else{
      updateTerrainLayers();
    }
  });

  $('terrainFit').onclick=()=>{
    if(currentProvider==='google' && googleMap){
      googleMap.fitBounds(TERRAIN_BOUNDS,0);
    }else if(currentProvider==='osm' && osmMap){
      osmMap.fitBounds([
        [TERRAIN_BOUNDS.west,TERRAIN_BOUNDS.south],
        [TERRAIN_BOUNDS.east,TERRAIN_BOUNDS.north]
      ],{padding:20,duration:500});
    }
  };

  $('londonBtn').onclick=()=>{
    if(currentProvider==='google'&&googleMap){
      googleMap.setCenter(CENTER);googleMap.setZoom(10);
      sharedView={lat:CENTER.lat,lng:CENTER.lng,zoom:10,source:currentProvider};
    }else if(currentProvider==='osm'&&osmMap){
      osmMap.flyTo({center:[CENTER.lng,CENTER.lat],zoom:10,pitch:0,bearing:0});
      sharedView={lat:CENTER.lat,lng:CENTER.lng,zoom:10,source:currentProvider};
    }
  };

  $('resetBtn').onclick=()=>{
    if(currentProvider==='google'&&googleMap){
      googleMap.setCenter(CENTER);googleMap.setZoom(ZOOM);
      sharedView={lat:CENTER.lat,lng:CENTER.lng,zoom:ZOOM,source:currentProvider};
      googleMap.setMapTypeId('roadmap');$('mapType').value='roadmap';
    }else if(currentProvider==='osm'&&osmMap){
      osmMap.jumpTo({center:[CENTER.lng,CENTER.lat],zoom:ZOOM,pitch:0,bearing:0});
      sharedView={lat:CENTER.lat,lng:CENTER.lng,zoom:ZOOM,source:currentProvider};
    }
  };

  $('locateBtn').onclick=()=>{
    if(!navigator.geolocation){say('浏览器不支持定位。',true);return;}
    say('正在定位…');
    navigator.geolocation.getCurrentPosition(async pos=>{
      const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
      if(currentProvider==='google'){
        await initGoogle();
        if(!googleMap)return;
        googleMap.panTo(p);googleMap.setZoom(15);
          sharedView={lat:p.lat,lng:p.lng,zoom:15,source:currentProvider};
        if(googleMarker)googleMarker.setMap(null);
        googleMarker=new google.maps.Marker({position:p,map:googleMap,title:'当前位置'});
      }else{
        initOSM();
        osmMap.flyTo({center:[p.lng,p.lat],zoom:15});
          sharedView={lat:p.lat,lng:p.lng,zoom:15,source:currentProvider};
        if(osmMarker)osmMarker.remove();
        osmMarker=new maplibregl.Marker().setLngLat([p.lng,p.lat]).addTo(osmMap);
      }
      say('定位成功。');
    },err=>say('定位失败：'+err.message,true),{
      enableHighAccuracy:true,timeout:10000,maximumAge:60000
    });
  };

  $('collapse').onclick=()=>{
    $('panel').classList.toggle('collapsed');
    $('collapse').textContent=$('panel').classList.contains('collapsed')?'+':'−';
    setTimeout(()=>{
      if(osmMap&&currentProvider==='osm')osmMap.resize();
    },100);
  };

  syncBadge();
  initGoogle();
</script>
</body>
</html>
